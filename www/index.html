<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>YourScan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========== 首页 ========== -->
  <section id="v-home" class="view active">
    <header class="top home-top" id="home-bar">
      <button class="icon-btn" id="btn-menu" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h2 id="home-title">YourScan</h2>
      <button class="icon-btn" id="btn-search" aria-label="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>
    <header class="top home-top" id="search-bar" hidden>
      <button class="icon-btn" id="search-close" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off" />
    </header>

    <main class="docs" id="doc-list"></main>
    <div class="empty" id="empty" hidden>
      <img class="empty-logo lg-l" src="img/logo-light.png" alt="" /><img class="empty-logo lg-d" src="img/logo-dark.png" alt="" />
      <p id="empty-text"></p>
    </div>

    <nav class="actionbar">
      <button class="sq" id="btn-gallery" aria-label="gallery">
        <svg viewBox="0 0 24 24" class="fill"><path d="M3 19 9 11l4 5 3-4 5 7z"/></svg>
      </button>
      <button class="sq" id="btn-scan" aria-label="scan">
        <svg viewBox="0 0 24 24"><path d="M8 6l1.6-2h4.8L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </nav>
  </section>

  <!-- ========== 文件页（页面格子） ========== -->
  <section id="v-doc" class="view">
    <header class="top home-top">
      <button class="icon-btn" id="doc-back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <h2 id="doc-title" class="tap"></h2>
      <button class="icon-btn pdf-btn" id="doc-pdf" aria-label="pdf"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><b>PDF</b></button>
      <button class="icon-btn" id="doc-menu" aria-label="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </header>
    <main class="pgrid" id="doc-pages"></main>
    <nav class="actionbar docbar">
      <button class="sq sm" id="doc-add-gallery" aria-label="gallery"><svg viewBox="0 0 24 24" class="fill"><path d="M3 19 9 11l4 5 3-4 5 7z"/></svg></button>
      <button class="sq sm" id="doc-add-scan" aria-label="scan"><svg viewBox="0 0 24 24"><path d="M8 6l1.6-2h4.8L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <span class="flex"></span>
      <button class="tb" id="doc-share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share"></span></button>
      <button class="tb" id="doc-more"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg><span data-i18n="more"></span></button>
    </nav>
    <nav class="actionbar selbar">
      <button class="tb" id="sel-all"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="selectAll"></span></button>
      <button class="tb" id="sel-del"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg><span data-i18n="del"></span></button>
      <button class="tb" id="sel-copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span data-i18n="copyPages"></span></button>
      <button class="tb" id="sel-collage"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span data-i18n="collage"></span></button>
      <button class="tb" id="sel-share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share"></span></button>
    </nav>
  </section>

  <!-- ========== 拼图 ========== -->
  <section id="v-collage" class="view darkview">
    <header class="top home-top">
      <button class="icon-btn" id="cl-back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <h2 data-i18n="collage"></h2>
      <button class="icon-btn okbtn" id="cl-ok" aria-label="ok"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
    </header>
    <div class="stage fstage" id="cl-stage"><canvas id="cl-canvas"></canvas></div>
    <div class="cl-note" id="cl-note"></div>
    <div class="sliders"><label><span data-i18n="size"></span><input type="range" id="cl-scale" min="30" max="100" step="1" value="100" /><em id="cl-sv">100%</em></label></div>
    <div class="layouts" id="cl-layouts"></div>
  </section>

  <!-- ========== 单页（左右滑） ========== -->
  <section id="v-page" class="view darkview">
    <header class="top home-top">
      <button class="icon-btn" id="pg-back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <h2 id="pg-title"></h2>
      <button class="icon-btn" id="pg-crop" aria-label="crop"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
      <button class="icon-btn" id="pg-filter" aria-label="filter"><svg viewBox="0 0 24 24"><path d="m15 4 5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg></button>
      <button class="icon-btn" id="pg-more" aria-label="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </header>
    <div class="slides" id="pg-slides"></div>
    <div class="pg-ind" id="pg-ind"></div>
    <nav class="toolbar">
      <button class="tb" id="pg-ocr"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg><span>OCR</span></button>
      <button class="tb" id="pg-rotate"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-i18n="rotate"></span></button>
      <span class="flex"></span>
      <button class="tb" id="pg-share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share"></span></button>
      <button class="tb" id="pg-del"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg><span data-i18n="del"></span></button>
    </nav>
  </section>

  <!-- ========== 边界调整 ========== -->
  <section id="v-crop" class="view darkview">
    <header class="top home-top">
      <button class="icon-btn" id="cr-back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <h2 data-i18n="cropTitle"></h2>
    </header>
    <div class="stage" id="cr-stage"><img id="cr-img" alt="" /><svg id="cr-svg"></svg></div>
    <nav class="toolbar">
      <button class="tb" id="cr-full"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span data-i18n="fullPage"></span></button>
      <button class="tb" id="cr-rl"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="rotateLeft"></span></button>
      <button class="tb" id="cr-rr"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-i18n="rotateRight"></span></button>
      <span class="flex"></span>
      <button class="tb ok" id="cr-ok"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="done"></span></button>
    </nav>
  </section>

  <!-- ========== 滤镜 ========== -->
  <section id="v-filter" class="view darkview">
    <header class="top home-top">
      <button class="icon-btn" id="fl-back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <h2 data-i18n="filterTitle"></h2>
      <button class="pill-btn ghostpill" id="fl-all" data-i18n="applyAll"></button>
    </header>
    <div class="ftabs" id="fl-tabs"></div>
    <div class="stage fstage"><img id="fl-img" alt="" /></div>
    <div class="sliders">
      <label><span data-i18n="brightness"></span><input type="range" id="fl-b" min="-50" max="50" step="1" value="0" /><em id="fl-bv">0</em></label>
      <label><span data-i18n="contrast"></span><input type="range" id="fl-c" min="-50" max="50" step="1" value="0" /><em id="fl-cv">0</em></label>
    </div>
    <nav class="toolbar">
      <button class="tb" id="fl-rl"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="rotateLeft"></span></button>
      <button class="tb" id="fl-rr"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-i18n="rotateRight"></span></button>
      <button class="tb" id="fl-reset"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span data-i18n="reset"></span></button>
      <span class="flex"></span>
      <button class="tb ok" id="fl-ok"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="done"></span></button>
    </nav>
  </section>

  <!-- 隐藏的文件选择 -->
  <input id="file-input" type="file" accept="image/*" multiple hidden />
  <input id="pdf-input" type="file" accept="*/*" multiple hidden />
  <input id="zip-input" type="file" accept=".zip,application/zip,application/x-zip-compressed,application/octet-stream" hidden />

  <!-- 侧边菜单 -->
  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer"></aside>

  <!-- 弹层 -->
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet"></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><p id="busy-text"></p></div>
  <div class="toast" id="toast"></div>

  <script src="vendor/capacitor.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="i18n.js"></script>
  <script src="core.js"></script>
  <script src="home.js"></script>
  <script src="doc.js"></script>
  <script src="main.js"></script>
</body>
</html>
