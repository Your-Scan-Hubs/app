<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>YourScan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========== 首页 ========== -->
  <section id="v-home" class="view active">
    <header class="top home-top" id="home-bar">
      <button class="icon-btn" id="btn-menu" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h2 id="home-title">YourScan</h2>
      <button class="icon-btn" id="btn-search" aria-label="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>
    <header class="top home-top" id="search-bar" hidden>
      <button class="icon-btn" id="search-close" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off" />
    </header>

    <main class="docs" id="doc-list"></main>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <p id="empty-text"></p>
    </div>

    <nav class="actionbar">
      <button class="sq" id="btn-gallery" aria-label="gallery">
        <svg viewBox="0 0 24 24" class="fill"><path d="M3 19 9 11l4 5 3-4 5 7z"/></svg>
      </button>
      <button class="sq" id="btn-scan" aria-label="scan">
        <svg viewBox="0 0 24 24"><path d="M8 6l1.6-2h4.8L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </nav>
  </section>

  <!-- ========== 编辑页 ========== -->
  <section id="v-editor" class="view">
    <header class="top">
      <button class="icon-btn" id="ed-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="ed-title"></h2>
      <button class="pill-btn" id="ed-save"></button>
    </header>

    <div class="ed-scroll">
      <div class="field">
        <label data-i18n="fileName"></label>
        <input id="ed-name" type="text" />
      </div>
      <div class="field">
        <label data-i18n="folder"></label>
        <select id="ed-folder"></select>
      </div>

      <div class="ed-hint" data-i18n="edHint"></div>
      <div class="pages" id="ed-pages"></div>

      <div class="add-row">
        <button class="ghost" id="ed-add-scan"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="scanMore"></span></button>
        <button class="ghost" id="ed-add-gallery"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addPhotos"></span></button>
      </div>

      <div class="opts">
        <div class="opt">
          <label data-i18n="filterAll"></label>
          <div class="seg" id="ed-filter-all"></div>
        </div>
        <div class="opt">
          <label data-i18n="paper"></label>
          <div class="seg" id="ed-paper"></div>
        </div>
        <div class="opt">
          <label data-i18n="quality"></label>
          <div class="seg" id="ed-quality"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 文件详情 ========== -->
  <section id="v-detail" class="view">
    <header class="top">
      <button class="icon-btn" id="dt-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="dt-title"></h2>
      <button class="icon-btn" id="dt-more" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>
    <div class="dt-meta" id="dt-meta"></div>
    <div class="dt-actions">
      <button id="dt-share-pdf"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg><span data-i18n="sharePdf"></span></button>
      <button id="dt-share-img"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span data-i18n="shareImg"></span></button>
      <button id="dt-text"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span data-i18n="text"></span></button>
      <button id="dt-edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i18n="editPages"></span></button>
    </div>
    <div class="dt-pages" id="dt-pages"></div>
  </section>

  <!-- 隐藏的文件选择 -->
  <input id="file-input" type="file" accept="image/*" multiple hidden />
  <input id="zip-input" type="file" accept=".zip,application/zip,application/x-zip-compressed,application/octet-stream" hidden />

  <!-- 侧边菜单 -->
  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer"></aside>

  <!-- 弹层 -->
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet"></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><p id="busy-text"></p></div>
  <div class="toast" id="toast"></div>

  <script src="vendor/capacitor.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
