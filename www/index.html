<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4F6FA" />
  <title>YourScan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========== 首页 ========== -->
  <section id="v-home" class="view active">
    <header class="top">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></svg></span>
        <h1>YourScan</h1>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索文件名或文件里的文字" autocomplete="off" />
    </div>

    <div class="chips" id="folder-chips"></div>

    <main class="docs" id="doc-list"></main>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <p id="empty-text">还没有文件<br/>点下面的按钮开始扫描</p>
    </div>

    <nav class="actionbar">
      <button class="big" id="btn-scan">
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
        <span>拍照扫描</span>
      </button>
      <button class="big alt" id="btn-gallery">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><circle cx="8" cy="10" r="1.5"/><path d="m17 16-4-4-8 7"/></svg>
        <span>相册合成 PDF</span>
      </button>
    </nav>
  </section>

  <!-- ========== 编辑页 ========== -->
  <section id="v-editor" class="view">
    <header class="top">
      <button class="icon-btn" id="ed-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="ed-title">新文件</h2>
      <button class="pill-btn" id="ed-save">保存</button>
    </header>

    <div class="ed-scroll">
      <div class="field">
        <label>文件名</label>
        <input id="ed-name" type="text" />
      </div>
      <div class="field">
        <label>文件夹</label>
        <select id="ed-folder"></select>
      </div>

      <div class="ed-hint">长按页面可拖动排序 · 点页面可旋转、换滤镜、删除</div>
      <div class="pages" id="ed-pages"></div>

      <div class="add-row">
        <button class="ghost" id="ed-add-scan"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>扫描更多</button>
        <button class="ghost" id="ed-add-gallery"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>从相册添加</button>
      </div>

      <div class="opts">
        <div class="opt">
          <label>全部页面滤镜</label>
          <div class="seg" id="ed-filter-all"></div>
        </div>
        <div class="opt">
          <label>纸张</label>
          <div class="seg" id="ed-paper"></div>
        </div>
        <div class="opt">
          <label>画质</label>
          <div class="seg" id="ed-quality"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 文件详情 ========== -->
  <section id="v-detail" class="view">
    <header class="top">
      <button class="icon-btn" id="dt-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="dt-title"></h2>
      <button class="icon-btn" id="dt-more" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>
    <div class="dt-meta" id="dt-meta"></div>
    <div class="dt-actions">
      <button id="dt-share-pdf"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg><span>分享 PDF</span></button>
      <button id="dt-share-img"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>分享图片</span></button>
      <button id="dt-text"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span>文字</span></button>
      <button id="dt-edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>编辑页面</span></button>
    </div>
    <div class="dt-pages" id="dt-pages"></div>
  </section>

  <!-- 隐藏的文件选择 -->
  <input id="file-input" type="file" accept="image/*" multiple hidden />

  <!-- 弹层 -->
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet"></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><p id="busy-text">处理中…</p></div>
  <div class="toast" id="toast"></div>

  <script src="vendor/capacitor.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
