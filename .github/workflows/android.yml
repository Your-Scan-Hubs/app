name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android

          # 1) 版本号：每次打包自动 +1，同事可以直接覆盖安装更新
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

          # App 图标（蓝底恐龙扫描）+ 启动画面（日间 A / 夜间 C）
          cp -r native/icon/android/. android/app/src/main/res/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1F5EFF</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          for f in $(find android/app/src/main/res -iname 'splash*.png'); do cp native/splash/splash-light.png "$f"; done
          mkdir -p android/app/src/main/res/drawable-night
          cp native/splash/splash-dark.png android/app/src/main/res/drawable-night/splash.png
          ls android/app/src/main/res/mipmap-anydpi-v26/ && cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          # 夜间模式：让网页能跟随手机深色模式
          sed -i 's/Theme.AppCompat.Light.DarkActionBar/Theme.AppCompat.DayNight.DarkActionBar/; s/Theme.AppCompat.Light.NoActionBar/Theme.AppCompat.DayNight.NoActionBar/' android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values/styles.xml

          # 固定签名：直接在 build.gradle 指定我们自己的签名文件（之前放在 ~/.android 没生效）
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixed {
                      storeFile file('../../native/android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  rel {
                      storeFile file('../../native/android/release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
                      keyAlias 'yourscanner'
                      keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
                  release {
                      signingConfig System.getenv('KEYSTORE_PASSWORD') ? signingConfigs.rel : signingConfigs.fixed
                      minifyEnabled false
                  }
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          GRADLE

          # 2) 离线文字识别（ML Kit 中文模型，同时认英文/马来文）
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
          }
          GRADLE

          # 3) 原生代码：OCR 插件 + MainActivity
          JAVA_DIR=android/app/src/main/java/com/yourscanhubs/app
          cp native/android/OcrPlugin.java native/android/YsNativePlugin.java native/android/MainActivity.java $JAVA_DIR/

          # 4) 分享进来直接在主程序打开（不另开窗口，原生转换和文字识别都能用）
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          filters = '''
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.ms-powerpoint" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation" />
                          <data android:mimeType="application/rtf" />
                          <data android:mimeType="application/vnd.oasis.opendocument.text" />
                      </intent-filter>
          '''
          meta = '''
                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="ocr_chinese" />
          '''
          m = re.search(r'<activity[^>]*\.MainActivity[\s\S]*?</activity>', s)
          assert m, 'MainActivity not found'
          block = m.group(0)
          if 'android.intent.action.SEND"' not in block:
              block = block.replace('</activity>', filters + '        </activity>')
              s = s[:m.start()] + block + s[m.end():]
          if 'mlkit.vision.DEPENDENCIES' not in s:
              s = s.replace('</application>', meta + '    </application>')
          open(p, 'w').write(s)
          print(s)
          PY

          npx cap sync android

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.android
          cp native/android/debug.keystore ~/.android/debug.keystore
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            # 正式签名：签名文件加密放在仓库里，密码只存在 GitHub Secrets
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in native/android/release.keystore.enc -out native/android/release.keystore -pass env:KEYSTORE_PASSWORD
            TASK=assembleRelease; APK=app/build/outputs/apk/release/app-release.apk
            echo "正式版（release）"
          else
            TASK=assembleDebug; APK=app/build/outputs/apk/debug/app-debug.apk
            echo "还没设 KEYSTORE_PASSWORD，先打测试版（debug）"
          fi
          cd android
          chmod +x gradlew
          ./gradlew $TASK || (echo "重试一次" && sleep 30 && ./gradlew $TASK)
          keytool -printcert -jarfile $APK | grep SHA256
          cp $APK ../YourScanner.apk
          rm -f ../native/android/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: YourScanner-apk
          path: YourScanner.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp YourScanner.apk YourScan.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "YourScanner Android 最新版" --notes "每次更新后自动替换。手机上直接下载 YourScanner.apk 安装即可（覆盖安装，不会丢失文件）。" --prerelease
          gh release upload android-latest YourScanner.apk YourScan.apk --clobber
          gh release edit android-latest --notes "版本 1.0.${{ github.run_number }}。手机上直接下载 YourScanner.apk 安装即可（覆盖安装，不会丢失文件）。"
